# Lancefield prize escrow. Dependencies are pinned with Soldeer (see [dependencies] and soldeer.lock);
# run `forge soldeer install` once, then `forge build` / `forge test`.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
cbor_metadata = false
# The deploy script writes deployments/<chainId>.json, which the app reads.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[lint]
# Deadlines and the pick window are measured in days; a validator nudging a timestamp by seconds cannot matter.
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 128

[soldeer]
# remappings.txt is written by hand (stable import paths); Soldeer only fetches the pinned archives.
remappings_generate = false
recursive_deps = false

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
