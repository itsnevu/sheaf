[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

# Robinhood Chain uses a Blockscout explorer. Both values come from the environment; nothing is
# hard-coded. `forge verify-contract --verifier blockscout --verifier-url "$EXPLORER_API_URL"`
# works without this block as well (see README).
[etherscan]
robinhood = { key = "${EXPLORER_API_KEY}", url = "${EXPLORER_API_URL}", chain = 4663 }

[lint]
# block.timestamp comparisons are the intended deadlines; events are emitted for every role change;
# the winner loop is bounded (MAX_WINNERS = 16) and must revert atomically on a bad entry;
# a zero registrar is the documented "registration disabled" setting (owner zero is rejected by Ownable).
exclude_lints = [
    "block-timestamp",
    "missing-events-access-control",
    "reentrancy-events",
    "calls-loop",
    "require-revert-in-loop",
    "missing-zero-check",
]
